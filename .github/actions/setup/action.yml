name: Set up PushDocs
description: Install the repository's pinned Node and Yarn dependencies.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 20.19.6
    - shell: bash
      run: corepack enable
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 20.19.6
        cache: yarn
        cache-dependency-path: yarn.lock
    - shell: bash
      run: yarn install --immutable

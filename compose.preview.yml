# Optional overlay. Use a dedicated Docker host for untrusted documentation repositories.
services:
  web:
    environment:
      PUSHDOCS_PREVIEW_DOMAIN: ${PUSHDOCS_PREVIEW_DOMAIN:?Set a separate wildcard preview domain}
      PUSHDOCS_PREVIEW_KEY: ${PUSHDOCS_PREVIEW_KEY:?Set a random key of at least 32 characters}
  preview:
    build:
      context: .
      dockerfile: deploy/preview.Dockerfile
    environment:
      DATABASE_URL: postgres://pushdocs:pushdocs@postgres:5432/pushdocs
      PUSHDOCS_ENCRYPTION_KEY: ${PUSHDOCS_ENCRYPTION_KEY:?Required}
      PUSHDOCS_PREVIEW_KEY: ${PUSHDOCS_PREVIEW_KEY:?Required}
      PUSHDOCS_PREVIEW_DOMAIN: ${PUSHDOCS_PREVIEW_DOMAIN:?Required}
      PUSHDOCS_PREVIEW_IMAGE: ${PUSHDOCS_PREVIEW_IMAGE:-}
      PUSHDOCS_PREVIEW_RUNTIMES: ${PUSHDOCS_PREVIEW_RUNTIMES:-}
      PUSHDOCS_PREVIEW_VOLUME: pushdocs_previews
      PUSHDOCS_PREVIEW_DIR: /data/previews
      PUSHDOCS_ATTACHMENTS_DIR: /data/attachments
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - previews:/data/previews
      - attachments:/data/attachments:ro
    ports:
      - "127.0.0.1:4200:4200"
    networks:
      - default
      - database
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  previews:
    name: pushdocs_previews
